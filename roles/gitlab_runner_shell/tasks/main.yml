
---
- name: Install GitLab Runner repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download GitLab Runner repository signing key
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
    dest: /etc/apt/keyrings/gitlab-runner.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure official GitLab Runner repository
  ansible.builtin.deb822_repository:
    name: gitlab-runner
    types:
      - deb
    uris: https://packages.gitlab.com/runner/gitlab-runner/debian/
    suites: bookworm
    components:
      - main
    signed_by: /etc/apt/keyrings/gitlab-runner.asc
    state: present
    enabled: true

- name: Install GitLab Runner
  ansible.builtin.apt:
    name: gitlab-runner
    state: present
    update_cache: true

- name: Install CI integration test tools
  ansible.builtin.apt:
    name: "{{ gitlab_runner_packages }}"
    state: present
    update_cache: true

- name: Validate GitLab Runner authentication token
  ansible.builtin.assert:
    that:
      - gitlab_runner_tokens.shell_01 is defined
      - gitlab_runner_tokens.shell_01 | length > 0
      - gitlab_runner_tokens.shell_01 is match('^glrt-')
    fail_msg: "A valid GitLab Runner authentication token is required."
  no_log: true

- name: Check GitLab Runner configuration
  ansible.builtin.stat:
    path: "{{ gitlab_runner_config_path }}"
  register: gitlab_runner_config

- name: Check existing runner registration
  ansible.builtin.command:
    argv:
      - grep
      - -Fq
      - "{{ gitlab_runner_tokens.shell_01 }}"
      - "{{ gitlab_runner_config_path }}"
  register: gitlab_runner_registration
  changed_when: false
  failed_when: false
  no_log: true
  when: gitlab_runner_config.stat.exists

- name: Register GitLab Group Runner
  ansible.builtin.command:
    argv:
      - gitlab-runner
      - register
      - --non-interactive
      - --url
      - "{{ gitlab_url }}"
      - --token
      - "{{ gitlab_runner_tokens.shell_01 }}"
      - --executor
      - "{{ gitlab_runner_executor }}"
      - --shell
      - "{{ gitlab_runner_shell }}"
      - --name
      - "{{ gitlab_runner_description }}"
  register: gitlab_runner_register_result
  no_log: true
  when: >
    not gitlab_runner_config.stat.exists or
    gitlab_runner_registration.rc | default(1) != 0

- name: Ensure GitLab Runner service is enabled and started
  ansible.builtin.service:
    name: gitlab-runner
    enabled: true
    state: started
