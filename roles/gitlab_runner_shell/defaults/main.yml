---
gitlab_runner_config_path: /etc/gitlab-runner/config.toml

gitlab_url: "https://gitlab.com"
gitlab_runner_description: proxmox-lxc-shell-runner
gitlab_runner_executor: shell
gitlab_runner_shell: bash

gitlab_runner_packages:
  - git
  - curl
  - ca-certificates
  - postgresql-client
  - redis-tools