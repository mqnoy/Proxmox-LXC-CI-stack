---
- name: Configure shared LXC prerequisites
  hosts: all
  become: true
  roles:
    - common

- name: Configure PostgreSQL CI service
  hosts: postgres_ci
  become: true
  roles:
    - postgres_ci

- name: Configure Valkey CI service
  hosts: valkey_ci
  become: true
  roles:
    - valkey_ci

- name: Configure GitLab shell runner
  hosts: gitlab-runner-shell-01
  become: true
  roles:
    - gitlab_runner_shell

- name: Configure rootless image build runner
  hosts: gitlab-runner-build-01
  become: true
  roles:
    - gitlab_build_runner

- name: Configure Mailpit CI service
  hosts: mailpit-ci
  become: true
  roles:
    - mailpit_ci